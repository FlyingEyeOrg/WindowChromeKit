name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WindowChromeKit.sln

      - name: Build
        run: dotnet build WindowChromeKit.sln -c Release --no-restore

      - name: Test
        run: dotnet test WindowChromeKit.sln -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj -c Release --no-build --no-restore -o artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
