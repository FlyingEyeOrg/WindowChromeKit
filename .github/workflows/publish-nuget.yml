name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "手动发布的包版本，例如 1.0.1；留空时使用 VersionPrefix"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}-${{ inputs.package_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: windows-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine package versions
        id: version
        shell: pwsh
        run: |
          # 两个包的版本线是独立的：各自按自己 csproj 里的 VersionPrefix 发布。
          # tag（v*）只作为触发条件，不决定版本号；手动 dispatch 时填的 package_version
          # 会同时覆盖两个包的版本（发应急版本用）。
          function Get-VersionPrefix([string]$projectPath) {
              [xml]$project = Get-Content $projectPath
              return [string]$project.Project.PropertyGroup.VersionPrefix
          }

          $override = "${{ inputs.package_version }}".Trim()
          if ($override) {
              $wpfVersion = $override
              $winFormsVersion = $override
          }
          else {
              $wpfVersion = Get-VersionPrefix "src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj"
              $winFormsVersion = Get-VersionPrefix "src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj"
          }

          foreach ($version in @($wpfVersion, $winFormsVersion)) {
              if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
                  throw "无效的 NuGet 版本：$version"
              }
          }

          "wpf=$wpfVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "winforms=$winFormsVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "WindowChromeKit.Wpf=$wpfVersion  WindowChromeKit.WinForms=$winFormsVersion"

      # 说明：解决方案里还有 samples/WindowChromeKit.Native.Sample（C++ 的 vcxproj），
      # dotnet CLI 的 MSBuild 不认 C++ targets（MSB4278: VCTargetsPath），整个 sln 会构建失败；
      # 而 dotnet build/restore 一次只接受一个项目参数（MSB1008），所以这里逐个跑 .NET 工程。
      # C++ 示例由本机 Visual Studio 的 MSBuild 构建（见 README）。
      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
              "src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj",
              "src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj",
              "samples/WindowChromeKit.Wpf.Sample/WindowChromeKit.Wpf.Sample.csproj",
              "samples/WindowChromeKit.WinForms.Sample/WindowChromeKit.WinForms.Sample.csproj",
              "tests/WindowChromeKit.Wpf.Tests/WindowChromeKit.Wpf.Tests.csproj"
          )
          foreach ($project in $projects) {
              dotnet restore $project
              if ($LASTEXITCODE -ne 0) { throw "restore 失败：$project" }
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
              "src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj",
              "src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj",
              "samples/WindowChromeKit.Wpf.Sample/WindowChromeKit.Wpf.Sample.csproj",
              "samples/WindowChromeKit.WinForms.Sample/WindowChromeKit.WinForms.Sample.csproj",
              "tests/WindowChromeKit.Wpf.Tests/WindowChromeKit.Wpf.Tests.csproj"
          )
          foreach ($project in $projects) {
              dotnet build $project -c Release --no-restore -p:ContinuousIntegrationBuild=true
              if ($LASTEXITCODE -ne 0) { throw "build 失败：$project" }
          }

      - name: Test
        run: dotnet test tests/WindowChromeKit.Wpf.Tests/WindowChromeKit.Wpf.Tests.csproj -c Release --no-build --no-restore

      - name: Pack WindowChromeKit.Wpf
        run: dotnet pack src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj -c Release --no-build --no-restore -o artifacts -p:PackageVersion=${{ steps.version.outputs.wpf }} -p:ContinuousIntegrationBuild=true -p:IncludeSource=true

      - name: Pack WindowChromeKit.WinForms
        run: dotnet pack src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj -c Release --no-build --no-restore -o artifacts -p:PackageVersion=${{ steps.version.outputs.winforms }} -p:ContinuousIntegrationBuild=true -p:IncludeSource=true

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: WindowChromeKit-wpf${{ steps.version.outputs.wpf }}-winforms${{ steps.version.outputs.winforms }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Login to NuGet.org with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: UnknowName

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(
              @{ Name = "WindowChromeKit.Wpf";     Version = "${{ steps.version.outputs.wpf }}" },
              @{ Name = "WindowChromeKit.WinForms"; Version = "${{ steps.version.outputs.winforms }}" }
          )
          foreach ($package in $packages) {
              dotnet nuget push "artifacts/$($package.Name).$($package.Version).nupkg" `
                --source "https://api.nuget.org/v3/index.json" `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "$($package.Name) $($package.Version) 推送失败（退出码 $LASTEXITCODE）" }
          }
