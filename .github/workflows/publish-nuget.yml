name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "手动发布的包版本，例如 1.0.1；留空时使用 VersionPrefix"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}-${{ inputs.package_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: windows-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $manualVersion = "${{ inputs.package_version }}"

          if (-not [string]::IsNullOrWhiteSpace($manualVersion)) {
              $packageVersion = $manualVersion.Trim()
          }
          elseif ($env:GITHUB_REF -like "refs/tags/v*") {
              $packageVersion = $env:GITHUB_REF_NAME.Substring(1)
          }
          else {
              [xml]$project = Get-Content "src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj"
              $packageVersion = [string]$project.Project.PropertyGroup.VersionPrefix
          }

          # 两个包同一版本号发布：VersionPrefix 必须一致，否则先在这里失败
          [xml]$winFormsProject = Get-Content "src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj"
          $winFormsVersion = [string]$winFormsProject.Project.PropertyGroup.VersionPrefix
          if ($winFormsVersion -ne $packageVersion) {
              throw "WindowChromeKit.Wpf ($packageVersion) 与 WindowChromeKit.WinForms ($winFormsVersion) 的 VersionPrefix 不一致"
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "无效的 NuGet 版本：$packageVersion"
          }

          "value=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 说明：解决方案里还有 samples/WindowChromeKit.Native.Sample（C++ 的 vcxproj），
      # dotnet CLI 的 MSBuild 不认 C++ targets（MSB4278: VCTargetsPath），整个 sln 会构建失败；
      # 而 dotnet build/restore 一次只接受一个项目参数（MSB1008），所以这里逐个跑 .NET 工程。
      # C++ 示例由本机 Visual Studio 的 MSBuild 构建（见 README）。
      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
              "src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj",
              "src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj",
              "samples/WindowChromeKit.Wpf.Sample/WindowChromeKit.Wpf.Sample.csproj",
              "samples/WindowChromeKit.WinForms.Sample/WindowChromeKit.WinForms.Sample.csproj",
              "tests/WindowChromeKit.Wpf.Tests/WindowChromeKit.Wpf.Tests.csproj"
          )
          foreach ($project in $projects) {
              dotnet restore $project
              if ($LASTEXITCODE -ne 0) { throw "restore 失败：$project" }
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
              "src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj",
              "src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj",
              "samples/WindowChromeKit.Wpf.Sample/WindowChromeKit.Wpf.Sample.csproj",
              "samples/WindowChromeKit.WinForms.Sample/WindowChromeKit.WinForms.Sample.csproj",
              "tests/WindowChromeKit.Wpf.Tests/WindowChromeKit.Wpf.Tests.csproj"
          )
          foreach ($project in $projects) {
              dotnet build $project -c Release --no-restore -p:ContinuousIntegrationBuild=true
              if ($LASTEXITCODE -ne 0) { throw "build 失败：$project" }
          }

      - name: Test
        run: dotnet test tests/WindowChromeKit.Wpf.Tests/WindowChromeKit.Wpf.Tests.csproj -c Release --no-build --no-restore

      - name: Pack WindowChromeKit.Wpf
        run: dotnet pack src/WindowChromeKit.Wpf/WindowChromeKit.Wpf.csproj -c Release --no-build --no-restore -o artifacts -p:PackageVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true -p:IncludeSource=true

      - name: Pack WindowChromeKit.WinForms
        run: dotnet pack src/WindowChromeKit.WinForms/WindowChromeKit.WinForms.csproj -c Release --no-build --no-restore -o artifacts -p:PackageVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true -p:IncludeSource=true

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: WindowChromeKit-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Login to NuGet.org with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: UnknowName

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($package in @("WindowChromeKit.Wpf", "WindowChromeKit.WinForms")) {
              dotnet nuget push "artifacts/$package.${{ steps.version.outputs.value }}.nupkg" `
                --source "https://api.nuget.org/v3/index.json" `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "$package 推送失败（退出码 $LASTEXITCODE）" }
          }
